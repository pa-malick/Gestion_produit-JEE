spring.application.name=gestion-produits

# --- Base de donnees PostgreSQL ---
# Le serveur PostgreSQL de la machine ecoute sur le port 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/produitsdb
spring.datasource.username=postgres
spring.datasource.password=Abasse
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Serveur ---
server.port=8080

# --- Jeu de donnees de depart (data.sql) ---
# defer permet a Hibernate de creer les tables avant l'insertion des donnees
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
